[project]
name = "sep-agent-service"
version = "1.0.0"
description = "Agent service of the Solution Enablement Platform: hybrid search, AI agents, knowledge capture, evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<0.29",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.3,<0.6",
    "numpy>=1.26",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "langgraph>=1.0,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
