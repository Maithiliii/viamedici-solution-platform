      - customer: rheinwerk
        version: "8.0"
        date: 2024-10-01
        severity: S3
        channel: email
        engineer: sophie
        title: Search does not show changed products
        report: |
          After the server maintenance last week the search does not find products we changed.
        goal: Current search.
        symptoms: Stale search after maintenance.
        errors: ""
        module: SEARCH
        steps:
          - [Checked Solr delta job, "Disabled since restart", confirmed]
        outcome: resolved
        resolution: Job re-enabled, full import run.
      - customer: hanse
