  - number: SOL-023
    title: Users cannot edit attributes after role change (attribute group rights missing)
    issue: |
      Users can open products but attributes are read-only or hidden after they were moved to a new role.
    environment_conditions: All versions.
    cause: Attribute group rights are granted per role and are not copied when creating a new role. The new role lacks write rights on attribute groups.
    resolution_steps: |
      1. Compare Administration > Roles > <old role> > Attribute groups with the new role.
      2. Grant read/write on the required attribute groups.
      3. Ask users to log in again (rights are cached per session).
    verification_steps: User can edit the attributes.
    root_cause: CFG_PERMISSION_GROUPS
    modules: [AUTH]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: lumen
        version: "8.2"
        date: 2025-03-25
        severity: S3
        channel: email
        engineer: priya
        title: Editors cannot edit marketing texts
        report: |
          Our editors were moved to the new role "Content Editor" and now cannot edit marketing texts. Fields are grey.
        goal: Editors can work.
        symptoms: Read-only fields after role change.
        errors: ""
        module: AUTH
        steps:
          - [Compared role rights, "Attribute group 'Marketing' missing", confirmed]
        outcome: resolved
        resolution: Rights granted.
      - customer: medisan
        version: "9.1"
        date: 2026-05-26
        severity: S3
        channel: portal
        engineer: marco
        title: Regulatory fields hidden for new team members
        report: |
          New regulatory team members do not see the MDR fields at all.
        goal: Visibility of MDR fields.
        symptoms: Hidden attributes.
        errors: ""
        module: AUTH
        holdout: true
        steps:
          - [Checked role, "No read right on group 'Regulatory'", confirmed]
        outcome: resolved
        resolution: Read/write granted on 'Regulatory'.

  - number: SOL-024
    title: Scheduled job skipped or runs twice on daylight saving time change
    issue: |
      A nightly job (import/export) did not run, or ran twice, on the night of the daylight saving time change.
    environment_conditions: All versions; jobs scheduled between 02:00 and 03:00 local time with scheduler timezone set to a local zone.
    cause: On the spring DST change the hour 02:00-03:00 does not exist (job skipped); in autumn it exists twice (job runs twice).
    resolution_steps: |
      1. Check the job history around the DST date.
      2. Move the schedule outside 02:00-03:00 or set the scheduler timezone to UTC (Administration > Scheduler).
      3. Run the skipped job manually.
    verification_steps: Next DST change without skipped/duplicate runs.
    root_cause: INFRA_SCHEDULER_TIMEZONE
    modules: [JOBS]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: kessler
        version: "8.2"
        date: 2025-03-31
        severity: S3
        channel: email
        engineer: sophie
        title: Nightly SAP import did not run on Sunday
        report: |
          The SAP import scheduled at 02:30 did not run in the night to Sunday. All other nights fine.
        goal: Reliable nightly import.
        symptoms: Job skipped once.
        errors: ""
        module: JOBS
        steps:
          - [Checked job history, "No run on 2025-03-30 (DST)", confirmed]
        outcome: resolved
        resolution: Schedule moved to 03:15.
      - customer: polar
        version: "9.0"
        date: 2025-10-27
        severity: S4
        channel: portal
        engineer: jonas
        title: Export ran twice on Sunday night
        report: |
          Our Mirakl export ran twice on Sunday night and sent duplicate offers.
        goal: No duplicate runs.
        symptoms: Duplicate run.
        errors: ""
        module: JOBS
        steps:
          - [Checked job history, "Two runs at 02:30 (DST end)", confirmed]
        outcome: resolved
        resolution: Scheduler timezone set to UTC.
