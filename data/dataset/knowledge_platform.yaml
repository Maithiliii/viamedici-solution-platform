  - number: SOL-020
    title: Integrations receive HTTP 401 after upgrade to 9.0 (Basic Auth removed, OAuth2 required)
    issue: |
      After upgrading to EPIM 9.0, ERP/shop/middleware integrations calling the EPIM REST API fail with HTTP 401.
    environment_conditions: EPIM 9.0 and later; integrations that used Basic authentication.
    cause: Basic authentication was deprecated in 8.2 and removed in 9.0. Clients get 401 with API-AUTH-410.
    resolution_steps: |
      1. Confirm error code API-AUTH-410 in the API access log.
      2. Create an OAuth2 client (Administration > API clients) with the needed scopes.
      3. Switch the integration to client-credentials flow (token endpoint /oauth/token).
    verification_steps: Integration calls return 200; no API-AUTH-410 in log.
    root_cause: UPGRADE_API_AUTH
    modules: [API]
    integrations: []
    min_version: "9.0"
    max_version: null
    status: validated
    cases:
      - customer: brightline
        version: "9.0"
        date: 2025-04-15
        severity: S1
        channel: phone
        engineer: jonas
        title: Middleware cannot connect after upgrade
        report: |
          Our middleware that pushes stock data to EPIM gets 401 since the upgrade.
        goal: Middleware connected.
        symptoms: HTTP 401 for API calls.
        errors: "401 Unauthorized - API-AUTH-410 Basic authentication not supported"
        module: API
        steps:
          - [Checked API log, "API-AUTH-410", confirmed]
        outcome: resolved
        resolution: OAuth2 client created; middleware switched to client credentials.
      - customer: rheinwerk
        version: "9.0"
        date: 2025-08-26
        severity: S2
        channel: email
        engineer: marco
        title: SAP stock interface 401
        report: |
          SAP PI cannot send data to PIM since the update. 401 errors.
        goal: Interface working.
        symptoms: 401 errors.
        errors: "API-AUTH-410"
        module: API
        holdout: true
        steps:
          - [Checked log, "Basic auth used", confirmed]
        outcome: resolved
        resolution: OAuth2 client configured in SAP PI.
  - number: SOL-027
    title: API returns 401 "missing credentials" although token is valid (reverse proxy strips Authorization header)
    issue: |
      API clients get HTTP 401 with API-AUTH-401 "missing credentials" although they send a valid OAuth2 bearer token.
      Calls directly on the server (bypassing the proxy) work.
    environment_conditions: All versions; installations behind a corporate reverse proxy / WAF (Apache, F5, nginx).
    cause: The reverse proxy does not forward the Authorization header (e.g. Apache without "CGIPassAuth on" / header rewrite rule, WAF policy).
    resolution_steps: |
      1. Compare error codes: API-AUTH-401 (no credentials received) vs API-AUTH-410 (basic auth).
      2. Call the API directly on the application server with the same token; if it works, the proxy is the cause.
      3. Configure the proxy to forward Authorization (Apache: RequestHeader / CGIPassAuth; F5: allow header).
    verification_steps: Calls through the proxy succeed.
    root_cause: INFRA_PROXY_AUTH_HEADER
    modules: [API]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: medisan
        version: "9.0"
        date: 2025-05-27
        severity: S2
        channel: email
        engineer: jonas
        title: API returns 401 after EPIM upgrade
        report: |
          After the EPIM 9.0 upgrade our integration to the ERP middleware fails with 401. We already switched to
          OAuth2 as described in the upgrade guide, but it still fails. Token request works.
        goal: API working with OAuth2.
        symptoms: 401 although OAuth2 token is valid.
        errors: "401 Unauthorized - API-AUTH-401 missing credentials"
        module: API
        other_solutions:
          - {solution: SOL-020, outcome: failed, notes: "OAuth2 migration was already done; 401 persisted. Red herring: the error code was API-AUTH-401, not API-AUTH-410."}
        steps:
          - [Checked OAuth2 client, "Client valid, token issued", ruled_out]
          - [Compared API log error code, "API-AUTH-401 (missing credentials), not API-AUTH-410", confirmed]
          - [Called API directly on app server with token, "Works", confirmed]
          - [Checked proxy config, "WAF policy strips Authorization", confirmed]
        outcome: resolved
        resolution: WAF policy changed to forward the Authorization header. The OAuth2 migration (SOL-020) alone was not sufficient.
      - customer: kessler
        version: "9.1"
        date: 2026-02-17
        severity: S2
        channel: portal
        engineer: priya
        title: New Shopware middleware gets 401 from EPIM API
        report: |
          Our new middleware gets 401 "missing credentials" from the EPIM API. Same token works in Postman on the server.
        goal: Middleware connected.
        symptoms: 401 through proxy only.
        errors: "API-AUTH-401 missing credentials"
        module: API
        steps:
          - [Tested direct call, "200 OK", confirmed]
          - [Checked Apache config, "Authorization not forwarded", confirmed]
        outcome: resolved
        resolution: Apache rule added to forward Authorization header.

  - number: SOL-021
    title: Marketplace or middleware sync fails with HTTP 429 after 9.2 (API rate limiting)
    issue: |
      High-frequency integrations (marketplace sync, middleware, stock updates) fail intermittently with HTTP 429
      after upgrading to 9.2.
    environment_conditions: EPIM 9.2 and later; clients sending more than 600 requests per minute.
    cause: 9.2 enabled default API rate limiting of 600 requests/min per client.
    resolution_steps: |
      1. Confirm 429 responses and Retry-After header in the API log.
      2. Raise the limit for the client (Administration > API clients > Rate limit) after sizing review, and/or
      3. Make the client respect Retry-After and use bulk endpoints (/bulk/products).
    verification_steps: No 429 during a full sync cycle.
    root_cause: INT_RATE_LIMIT
    modules: [API]
    integrations: [MIRAKL]
    min_version: "9.2"
    max_version: null
    status: validated
    cases:
      - customer: brightline
        version: "9.2"
        date: 2026-03-31
        severity: S2
        channel: email
        engineer: marco
        title: Mirakl sync fails intermittently
        report: |
          Since the update our 15-minute Mirakl sync fails every few runs with "Too Many Requests".
        goal: Reliable marketplace sync.
        symptoms: Intermittent 429 errors.
        errors: "HTTP 429 Too Many Requests (Retry-After: 12)"
        module: API
        steps:
          - [Checked API log, "Up to 1.400 req/min from Mirakl connector", confirmed]
        outcome: resolved
        resolution: Client limit raised to 2.000 req/min; connector switched to bulk endpoint.
      - customer: polar
        version: "9.2"
        date: 2026-06-09
        severity: S3
        channel: portal
        engineer: priya
        title: Stock updates from SAP partially fail
        report: |
          Some stock updates from SAP fail with 429 since the 9.2 upgrade.
        goal: All stock updates processed.
        symptoms: 429 for part of the updates.
        errors: "429 Too Many Requests"
        module: API
        holdout: true
        steps:
          - [Checked client config, "Default limit 600/min", confirmed]
        outcome: resolved
        resolution: Retry-After handling in middleware; limit raised.

  - number: SOL-022
    title: Print catalogue shows wrong prices (InDesign data source uses default price scope)
    issue: |
      Generated print catalogues / data sheets show list prices or prices of another country instead of the intended price list.
    environment_conditions: All versions with InDesign publishing connector and scoped (channel/country) price attributes.
    cause: The InDesign template's data source references the default scope instead of the catalogue's price list scope.
    resolution_steps: |
      1. Open Publishing > Templates > <template> > Data source and check the scope for price attributes.
      2. Set the scope to the catalogue's price list (e.g. "PL-DE-B2B").
      3. Re-generate the affected pages.
    verification_steps: Prices on generated pages match the price list.
    root_cause: CFG_PRINT_SCOPE
    modules: [PRINT]
    integrations: [INDESIGN]
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: nordbau
        version: "8.1"
        date: 2024-08-06
        severity: S2
        channel: email
        engineer: marco
        title: Catalogue shows consumer prices instead of trade prices
        report: |
          Our new trade catalogue shows the consumer prices. It must show B2B prices. Print deadline is Friday.
        goal: Correct prices before print.
        symptoms: Wrong price list in catalogue.
        errors: ""
        module: PRINT
        steps:
          - [Checked template data source, "Default scope", confirmed]
        outcome: resolved
        resolution: Scope set to PL-DE-B2B; pages regenerated.
      - customer: lumen
        version: "9.2"
        date: 2026-08-18
        severity: S3
        channel: portal
        engineer: jonas
        title: Data sheets with Irish prices for UK
        report: |
