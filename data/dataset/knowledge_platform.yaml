  - number: SOL-016
    title: Automatic release no longer triggers after 9.1 upgrade (legacy workflow condition syntax)
    issue: |
      Products that used to be released automatically (e.g. after ERP import or when all mandatory fields are
      filled) now remain in status "in enrichment"/"in review" after the upgrade to 9.1. Manual release works.
    environment_conditions: EPIM 9.1 and later; workflows with conditions written before 9.1.
    cause: |
      9.1 introduced the template syntax {{attribute.code}} for workflow conditions. Conditions still using the
      legacy ${attr:code} syntax are evaluated as FALSE (warning WF-COND-301 in the workflow log), so automatic
      transitions never fire.
    resolution_steps: |
      1. Search the workflow log for WF-COND-301 warnings.
      2. Open the workflow definition, rewrite each condition to the {{attribute.code}} syntax.
      3. Use Workflow > Tools > "Re-evaluate conditions" for products waiting in the affected step.
    verification_steps: Waiting products move to "released"; no new WF-COND-301 warnings.
    root_cause: UPGRADE_WORKFLOW_SYNTAX
    modules: [WORKFLOW]
    integrations: []
    min_version: "9.1"
    max_version: null
    status: validated
    cases:
      - customer: medisan
        version: "9.1"
        date: 2025-10-21
        severity: S2
        channel: email
        engineer: priya
        title: Auto-release stopped working after update
        report: |
          Since the update to 9.1 our products are not released automatically anymore when the regulatory
          check is complete. We have to click release for every product.
        goal: Automatic release as before.
        symptoms: Automatic transition does not fire.
        errors: "WF-COND-301 legacy expression '${attr:reg_check_done} == true' evaluated as false"
        module: WORKFLOW
        steps:
          - [Checked workflow log, "WF-COND-301 warnings", confirmed]
        outcome: resolved
        resolution: Conditions rewritten to {{attribute.reg_check_done}}; re-evaluated waiting products.
      - customer: technoparts
        version: "9.1"
        date: 2025-11-04
        severity: S3
        channel: portal
        engineer: sophie
        title: ERP-updated products stay in "in enrichment"
        report: |
          Products updated from Dynamics should go to released automatically when complete. Since last week's
          upgrade they stay in "in enrichment".
        goal: ERP updates released automatically.
        symptoms: Products not released automatically.
        errors: ""
        module: WORKFLOW
        steps:
          - [Checked completeness, "Products complete", ruled_out]
          - [Checked conditions, "Legacy ${attr:...} syntax", confirmed]
        outcome: resolved
        resolution: Rewrote conditions; re-evaluated.
      - customer: alpenrad
        version: "9.1"
        date: 2025-12-16
        severity: S3
        channel: email
        engineer: marco
        title: Release automation broken
        report: |
          Our automatic release rule does not work anymore after the update. Products stay in review.
        goal: Automation working.
        symptoms: Products stay in review.
        errors: "WF-COND-301"
        module: WORKFLOW
        holdout: true
        steps:
          - [Checked log, "WF-COND-301", confirmed]
        outcome: resolved
        resolution: New syntax applied.

  - number: SOL-017
    title: PIM search does not find new or changed products (OpenSearch index read-only)
    issue: |
      Products created or changed recently cannot be found with the PIM search; older data is found. The
      indexing job shows errors or stays "pending".
    environment_conditions: EPIM 9.0 and later (OpenSearch). On-prem installations with local OpenSearch.
    cause: OpenSearch switched the index to read-only (flood-stage disk watermark reached, default 95% disk usage). Indexing requests are rejected with "index read-only / allow delete".
    resolution_steps: |
      1. Check the indexing job log for "FORBIDDEN/12/index read-only / allow delete (api)".
      2. Free disk space or extend the volume on the OpenSearch node.
      3. Remove the block: PUT /<index>/_settings {"index.blocks.read_only_allow_delete": null}.
      4. Run Jobs > "Search reindex (delta)".
    verification_steps: New products are found; indexing job green.
    root_cause: INFRA_INDEX_READONLY
    modules: [SEARCH, JOBS]
    integrations: []
    min_version: "9.0"
    max_version: null
    status: validated
    cases:
      - customer: kessler
        version: "9.0"
        date: 2025-08-12
        severity: S2
        channel: portal
        engineer: marco
        title: Search does not find new products
        report: |
          Products created since Friday cannot be found in the PIM search. Older products are found.
        goal: Search working for new products.
        symptoms: New products not searchable.
        errors: "IndexJob: cluster_block_exception FORBIDDEN/12/index read-only / allow delete (api)"
        module: SEARCH
        steps:
          - [Checked index job log, "read-only block", confirmed]
          - [Checked disk, "96% used", confirmed]
        outcome: resolved
        resolution: Volume extended, block removed, delta reindex.
      - customer: hanse
        version: "9.1"
        date: 2026-03-31
        severity: S3
        channel: email
        engineer: jonas
        title: Search results outdated
        report: |
          The search shows old product names; changes from this week are not found.
        goal: Current search results.
        symptoms: Stale search.
        errors: "cluster_block_exception"
        module: SEARCH
        holdout: true
        steps:
          - [Checked OpenSearch disk, "Flood stage", confirmed]
        outcome: resolved
        resolution: Old snapshots removed, block removed, reindex.

  - number: SOL-018
    title: PIM search results outdated (Solr core out of sync)
    issue: |
      Search results in the PIM are outdated or incomplete; changes from the last days are not found.
    environment_conditions: EPIM 8.x only (Apache Solr). Not applicable to 9.0+ (OpenSearch).
    cause: The Solr delta import job failed or was disabled (e.g. after a server restart), so the Solr core is no longer in sync.
    resolution_steps: |
      1. Check Jobs > "Solr delta import" status and last success.
      2. Re-enable the job and run "Solr full import" outside business hours.
    verification_steps: Recently changed products found.
    root_cause: INFRA_SOLR_OUT_OF_SYNC
    modules: [SEARCH, JOBS]
    integrations: []
    min_version: "8.0"
    max_version: "8.2"
    status: validated
