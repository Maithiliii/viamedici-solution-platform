# Domain: workflow, search, API, print, permissions, scheduler, infrastructure.

solutions:

  - number: SOL-015
    title: Products stuck in approval - workflow step assigned to a removed or renamed role
    issue: |
      Products stay in an approval step for days; nobody sees the tasks in their inbox. Often after a team
      reorganisation or role cleanup.
    environment_conditions: All versions with approval workflows.
    cause: The workflow step is assigned to a role that was renamed or deleted. Tasks are created but have no eligible assignee ("orphaned tasks").
    resolution_steps: |
      1. Open Workflow > Monitor and filter "orphaned tasks".
      2. Edit the workflow definition and assign the step to the current role.
      3. Run Tools > "Reassign orphaned tasks" for the workflow.
    verification_steps: Tasks visible in the team inbox; products move on after approval.
    root_cause: CFG_WORKFLOW_ROLE
    modules: [WORKFLOW, AUTH]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: lumen
        version: "8.2"
        date: 2025-03-11
        severity: S2
        channel: email
        engineer: marco
        title: Nothing gets approved since team restructuring
        report: |
          Since our editorial team was restructured, products are stuck in "Content approval". Nobody has tasks.
        goal: Approvals flowing again.
        symptoms: Products stuck, no tasks in inbox.
        errors: ""
        module: WORKFLOW
        steps:
          - [Checked workflow monitor, "312 orphaned tasks", confirmed]
          - [Checked role, "Role 'Content Approver' deleted", confirmed]
        outcome: resolved
        resolution: Step assigned to 'Editorial Lead'; orphaned tasks reassigned.
      - customer: medisan
        version: "9.1"
        date: 2025-11-18
        severity: S2
        channel: portal
        engineer: jonas
        title: Regulatory approval step not visible for reviewers
        report: |
          Our regulatory reviewers do not see approval tasks anymore. We renamed some roles for the four-eyes process.
        goal: Four-eyes approval working.
        symptoms: Reviewers have no tasks.
        errors: ""
        module: WORKFLOW
        holdout: true
        steps:
          - [Checked workflow definition, "Step assigned to old role name", confirmed]
        outcome: resolved
        resolution: Role assignment updated, tasks reassigned.
      - customer: nordbau
        version: "9.2"
        date: 2026-05-05
        severity: S3
        channel: email
        engineer: sophie
        title: Products remain in "Technical review"
        report: |
          About 80 products remain in technical review for two weeks. Our product managers say they have no tasks.
        goal: Products reviewed.
        symptoms: Products stuck in review.
        errors: ""
