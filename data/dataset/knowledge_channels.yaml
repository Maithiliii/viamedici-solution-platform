  - number: SOL-012
    title: DAM images show placeholder - CELUM connector OAuth refresh token expired
    issue: |
      Assets linked from the DAM show placeholders or "asset unavailable" in the PIM and in exports. Locally
      uploaded images are fine.
    environment_conditions: EPIM 9.0 and later with CELUM DAM connector (OAuth2 since 9.0).
    cause: |
      Since 9.0 DAM connectors use OAuth2 with refresh tokens. When the refresh token expires (default 90 days
      without rotation, or revoked after a DAM password policy change) the connector cannot fetch assets.
    resolution_steps: |
      1. Check Media > DAM connectors > CELUM: status "Authorization required" or log "invalid_grant".
      2. Re-authorize the connector with a technical DAM user.
      3. Enable "Rotate refresh token" so the token is renewed on every use.
      4. Run Jobs > "Resync DAM assets".
    verification_steps: Connector status green; placeholders replaced after resync.
    root_cause: INT_TOKEN_EXPIRED
    modules: [MEDIA]
    integrations: [CELUM]
    min_version: "9.0"
    max_version: null
    status: validated
    cases:
      - customer: medisan
        version: "9.0"
        date: 2025-08-26
        severity: S2
        channel: email
        engineer: marco
        title: All CELUM images replaced by placeholder
        report: |
          Since this morning every image coming from CELUM shows a grey placeholder in EPIM and in the SAP
          Commerce shop. Images uploaded directly are fine.
        goal: DAM images available.
        symptoms: DAM assets show placeholder.
        errors: "CelumConnector: token refresh failed: invalid_grant"
        module: MEDIA
        steps:
          - [Checked CELUM availability, "CELUM UI works", ruled_out]
          - [Checked connector log, "invalid_grant on refresh", confirmed]
        outcome: resolved
        resolution: Re-authorized connector, enabled refresh token rotation, resynced.
      - customer: kessler
        version: "9.1"
        date: 2026-01-13
        severity: S3
        channel: portal
        engineer: sophie
        title: DAM pictures not loading in PIM
        report: |
          Images from our DAM are not loading anymore in PIM ("asset unavailable"). Our IT changed the password
          policy in CELUM before Christmas.
        goal: Images available for enrichment and export.
        symptoms: Asset unavailable for DAM-linked media.
        errors: "401 from CELUM token endpoint"
        module: MEDIA
        steps:
          - [Checked connector status, "Authorization required", confirmed]
        outcome: resolved
        resolution: Connector re-authorized with technical user excluded from password expiry.

  - number: SOL-013
    title: Wrong language exported to a channel after 9.1 upgrade (per-channel locale fallback)
    issue: |
      A channel receives texts in the wrong language (usually English or German instead of a regional locale
      such as de-AT, fr-BE or nl-BE) for products without a translation in that locale.
    environment_conditions: EPIM 9.1 and later (per-channel fallback chains). Multi-locale channels.
    cause: |
      9.1 moved locale fallback chains to the channel level. Upgraded systems receive the GLOBAL chain for
      every channel, which ignores channel-specific chains configured before (e.g. de-AT -> de-DE -> en).
    resolution_steps: |
      1. Open Channels > <channel> > Localization and inspect the fallback chain per locale.
      2. Re-create the intended chain (e.g. de-AT -> de-DE, fr-BE -> fr-FR) for each channel.
      3. Run a full export of texts for the channel.
    verification_steps: Product without de-AT text shows de-DE text in the channel.
    root_cause: CFG_LOCALE_FALLBACK
    modules: [I18N, EXPORT]
    integrations: []
    min_version: "9.1"
    max_version: null
    status: validated
    cases:
      - customer: brightline
        version: "9.2"
        date: 2026-03-24
        severity: S2
        channel: email
        engineer: priya
        title: Belgian shop shows English texts
        report: |
          After the update this weekend our Belgian French shop (fr-BE) shows English descriptions for many
          products. Before it showed the French (fr-FR) text when no Belgian text existed.
        goal: French texts in the Belgian shop.
        symptoms: English instead of French fallback.
        errors: ""
        module: I18N
        steps:
          - [Checked translations exist in fr-FR, "Yes, complete", ruled_out]
          - [Checked channel fallback chain, "Channel uses global chain fr-BE -> en", confirmed]
        outcome: resolved
        resolution: Per-channel fallback fr-BE -> fr-FR -> en configured; texts re-exported.
      - customer: alpenrad
        version: "9.1"
        date: 2025-11-25
        severity: S3
        channel: portal
        engineer: jonas
        title: Austrian shop in English after update
        report: |
          Our Austrian Shopify store shows English product texts after the EPIM update. We only maintain de-DE
          and some de-AT texts.
        goal: German texts in the Austrian store.
        symptoms: English fallback instead of German.
        errors: ""
        module: I18N
        steps:
          - [Checked channel locale config, "de-AT falls back to en (global chain)", confirmed]
        outcome: resolved
        resolution: Configured de-AT -> de-DE -> en for the Shopify channel.

  - number: SOL-014
    title: New attributes missing in translation export (attribute not translatable)
    issue: |
      Translation agency (XLIFF export, XTM) does not receive texts for newly created attributes; translated
