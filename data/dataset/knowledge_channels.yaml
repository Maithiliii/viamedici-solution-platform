  - number: SOL-011
    title: Images missing in channel after rendition preset change (404 on image URLs)
    issue: |
      Product images are missing or broken in the webshop/marketplace (placeholder or 404), while images
      are visible in the PIM.
    environment_conditions: EPIM 8.2 and later (channel-specific rendition presets).
    cause: |
      The export profile references a rendition preset (e.g. "web_large") that no longer exists for the
      channel or was renamed. Assets are exported with URLs to renditions that were never generated.
    resolution_steps: |
      1. Open a broken image URL from the shop; a 404 on /renditions/<preset>/ confirms the pattern.
      2. Check Media > Rendition presets for the channel; compare with the preset in the export profile.
      3. Restore/rename the preset or update the profile, then run Jobs > "Regenerate renditions" for the channel.
      4. Re-run the export for products with media.
    verification_steps: Image URLs return 200; images visible in the channel.
    root_cause: CFG_MEDIA_RENDITION
    modules: [MEDIA, EXPORT]
    integrations: []
    min_version: "8.2"
    max_version: null
    status: validated
    cases:
      - customer: vinea
        version: "8.2"
        date: 2025-02-18
        severity: S2
        channel: email
        engineer: sophie
        title: Product images broken in Shopify
        report: |
          Since yesterday most product pictures in our Shopify store are broken (grey placeholder). In PIM the
          images are there. Our media colleague cleaned up the image sizes last week.
        goal: Images visible in shop again.
        symptoms: Broken images in shop; images fine in PIM.
        errors: "GET /renditions/web_large/... 404"
        module: MEDIA
        steps:
          - [Opened image URL, "404 on rendition web_large", confirmed]
          - [Checked rendition presets, "web_large renamed to web_xl during cleanup", confirmed]
        outcome: resolved
        resolution: Preset name restored, renditions regenerated, export re-run.
      - customer: alpenrad
        version: "9.1"
        date: 2026-02-03
        severity: S3
        channel: portal
        engineer: priya
        title: Amazon rejects images, Shopify shows none
        report: |
