      - customer: hanse
        version: "8.2"
        date: 2025-02-11
        severity: S3
        channel: portal
        engineer: jonas
        title: Variant data outdated in SAP Commerce after master change
        report: |
          Our master data team updated the material description for all shower fittings on the base article.
          SAP Commerce still shows the old text for the colour/finish variants. Base article is correct.
        goal: Variants in SAP Commerce reflect master changes.
        symptoms: Inherited description not exported to variants.
        errors: ""
        module: EXPORT
        steps:
          - [Checked SAP Commerce import logs, "Only base articles were received", confirmed]
          - [Verified change timestamps parent vs variant, "Only parent timestamp updated", confirmed]
