  - number: SOL-002
    title: Products missing in channel after upgrade to 9.x (export profile filter not migrated)
    issue: |
      After the upgrade to EPIM 9.0 (or later) the webshop/marketplace receives far fewer products, or no
      products at all, from an export profile that worked before the upgrade. The export job reports success.
    environment_conditions: |
      EPIM 9.0 and later, export profiles created before 9.0 (legacy export framework) that use channel
      filter expressions. Any channel connector (Shopware 6, Adobe Commerce, SAP Commerce, marketplaces).
    cause: |
      Channel Engine 2 (introduced in 9.0) migrates legacy export profiles automatically, but filter
      expressions written in the legacy syntax cannot be converted and are migrated as EMPTY filters.
      Depending on the profile the result is "export nothing" or "export only channel default assortment".
    resolution_steps: |
      1. Run `epim-cli channel migrate-profiles --validate` and look for "FILTER_NOT_MIGRATED" warnings.
      2. Open the profile in Export > Channel Engine > Profiles and re-create the filter in the new
         expression editor (the old expression is shown read-only under "Legacy filter").
      3. Run a preview ("Preview assortment") and compare the product count with the last pre-upgrade export.
      4. Run a full export for the profile.
      Note: a full export alone does NOT fix this, the filter itself is empty.
    verification_steps: |
      Preview assortment count matches the expected assortment; channel shows the products after the full export.
    root_cause: UPGRADE_EXPORT_PROFILE_MIGRATION
    modules: [EXPORT]
    integrations: [SHOPWARE6, ADOBE_COMMERCE, SAP_COMMERCE]
    min_version: "9.0"
    max_version: null
    status: validated
    cases:
      - customer: kessler
        version: "9.0"
        date: 2025-05-20
        severity: S1
        channel: phone
        engineer: jonas
        title: After upgrade only 12% of products in Shopware
        report: |
          URGENT: Since the upgrade to 9.0 on the weekend our Shopware shop only has about 50.000 instead of
          420.000 products. The export job is green. Our sales team is getting customer complaints. Please call back.
        goal: Full assortment back in the webshop immediately.
        symptoms: Product count in shop dropped drastically after upgrade; export job successful.
        errors: "Channel Engine: profile 'shopware-de' exported 51.204 items (previous run 418.877)"
        module: EXPORT
        steps:
          - [Checked Shopware API errors, "No rejected items", ruled_out]
          - [Ran migrate-profiles --validate, "FILTER_NOT_MIGRATED on profile shopware-de", confirmed]
          - [Compared legacy filter vs new filter, "New filter empty, fallback to channel default category", confirmed]
        outcome: resolved
        resolution: Re-created the assortment filter in Channel Engine 2, previewed 418k items, ran full export.
      - customer: nordbau
        version: "9.0"
        date: 2025-06-24
        severity: S2
        channel: portal
        engineer: marco
        title: Magento receives no products since update
        report: |
          Since our update to version 9 the Magento export does not send any products anymore. Log says
          "0 items exported". Nothing was changed on our side apart from the update.
        goal: Restore the Adobe Commerce export.
        symptoms: Export job exports 0 items after upgrade.
        errors: "ExportJob[magento-b2b] finished: 0 items exported"
        module: EXPORT
        steps:
          - [Checked connector credentials, "Connection test OK", ruled_out]
          - [Validated migrated profiles, "Filter expression empty after migration", confirmed]
        outcome: resolved
        resolution: Filter re-created in new expression editor; full export run.
      - customer: rheinwerk
        version: "9.0"
        date: 2025-09-02
        severity: S2
        channel: email
        engineer: sophie
        title: Many products missing in Shopware after update to 9.0
        report: |
          Hello, after our update to 9.0 a big part of our tools are not in the webshop anymore. We know this
          problem from last year (variants were old) and did a full export again but it did not help this time.
          Products are released in PIM.
        goal: All released products visible in the shop.
        symptoms: Products missing in shop after upgrade; full export did not help.
        errors: ""
        module: EXPORT
        holdout: true
        other_solutions:
          - {solution: SOL-001, outcome: failed, notes: "Full export workaround from 8.x tried first by customer and engineer; no effect on 9.0."}
        steps:
          - [Ran full export (known 8.x workaround), "No change in product count", ruled_out]
          - [Ran migrate-profiles --validate, "FILTER_NOT_MIGRATED for profile shop-main", confirmed]
        outcome: resolved
        resolution: Old workaround SOL-001 not applicable on 9.0. Recreated filter in Channel Engine 2; full export.
      - customer: medisan
        version: "9.0"
        date: 2025-06-10
        severity: S2
        channel: email
        engineer: priya
        title: SAP Commerce catalog incomplete after EPIM upgrade
        report: |
          After upgrading EPIM to 9.0 our SAP Commerce online catalog misses all products of the "Wound care"
          and "Diagnostics" categories. The export reports success. Other categories are fine.
        goal: Complete catalog in SAP Commerce.
        symptoms: Whole categories missing after upgrade.
        errors: ""
        module: EXPORT
        steps:
          - [Checked category permissions for export user, "Permissions unchanged", ruled_out]
          - [Validated profile migration, "Category filter with legacy OR-syntax migrated empty", confirmed]
        outcome: resolved
        resolution: Rebuilt category filter in Channel Engine 2, verified with preview, full export.

  - number: SOL-003
    title: Products not exported because they are not released (export filter on workflow status)
    issue: |
      New or recently changed products do not appear in the webshop/marketplace, while older products
      are fine. The export runs without errors.
    environment_conditions: |
      All versions. Export profiles whose filter contains "status = released" (default for most channel
      profiles) combined with an approval/release workflow.
    cause: |
      The export only includes products in workflow status "released". Products waiting in an approval
      step, or whose automatic release did not happen, are excluded by design.
    resolution_steps: |
      1. Open an affected product and check its workflow status and current workflow step.
      2. Check the export profile filter (Export > Profiles > Filter) for the status condition.
      3. Release the products (or fix why they are not released: see workflow solutions) and re-run the export.
      4. If the business wants unreleased products exported, adjust the filter consciously and document it.
    verification_steps: Product shows status "released" and appears in the next export log.
    root_cause: CFG_EXPORT_FILTER
    modules: [EXPORT, WORKFLOW]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: alpenrad
        version: "8.2"
        date: 2025-03-04
        severity: S3
        channel: portal
        engineer: priya
        title: New season products not visible in Shopify
        report: |
          We created 300 new bikes for the summer season in PIM but they don't show up in Shopify. Old
          products are updated normally. The import from Dynamics worked.
        goal: Launch the new season on time.
        symptoms: Only new products missing in shop.
        errors: ""
        module: EXPORT
        steps:
          - [Checked Shopify connector log, "New products not in payload", confirmed]
          - [Checked workflow status of new products, "All in step 'Marketing approval'", confirmed]
        outcome: resolved
        resolution: Products were waiting in marketing approval. Customer released them; next export published them.
      - customer: technoparts
        version: "9.1"
        date: 2025-12-09
        severity: S3
        channel: email
        engineer: marco
        title: Changed products not reaching Adobe Commerce
        report: |
          Products we changed this week are not updated in our shop. It seems to affect only products that went
          through the editorial team. Export logs are clean.
        goal: Editorial changes visible in shop.
        symptoms: Edited products not exported; export clean.
        errors: ""
        module: EXPORT
        steps:
          - [Checked delta detection, "Products marked changed", ruled_out]
          - [Checked workflow status, "Products set back to 'in review' by editorial workflow", confirmed]
        outcome: resolved
        resolution: Editorial workflow resets status to 'in review'; export filter only takes released products. Products released.
      - customer: lumen
        version: "9.2"
        date: 2026-05-12
        severity: S4
        channel: portal
        engineer: sophie
        title: Some products missing from Magento export
        report: |
          A handful of new notebooks and pens are missing in the Magento shop. The rest of the catalogue is fine.
        goal: All products in the shop.
        symptoms: Individual new products missing.
        errors: ""
        module: EXPORT
        steps:
          - [Checked workflow status, "Products in step 'Legal check'", confirmed]
