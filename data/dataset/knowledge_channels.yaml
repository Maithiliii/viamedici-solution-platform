  - number: SOL-025
    title: Amazon rejects products after category template change (missing required attribute)
    issue: |
      Amazon Vendor Central rejects products from the PIM feed with "missing required attribute" errors for
      attributes that never existed in the mapping.
    environment_conditions: All versions with Amazon Vendor Central connector.
    cause: Amazon published a new version of the category (product type) template with new required attributes. The PIM mapping still targets the old template.
    resolution_steps: |
      1. Read the feed processing report and list the newly required attributes.
      2. Download the current product type definition in the connector (Export > Amazon > Templates > Refresh).
      3. Map the new attributes (or set defaults) and re-send the feed for rejected items.
    verification_steps: Feed processing report without errors for the product type.
    root_cause: INT_MARKETPLACE_TEMPLATE
    modules: [EXPORT]
    integrations: [AMAZON_VC]
    min_version: null
    max_version: null
    status: validated
