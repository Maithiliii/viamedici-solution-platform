        title: Webshop shows old product names on drill bit sizes
        report: |
          Customer called: after renaming the drill bit series the sizes (variants) in the webshop show the old
          series name. A full export they ran last month fixed a similar thing.
        goal: Correct names on all sizes.
        symptoms: Variants keep old inherited name after parent rename.
        errors: ""
