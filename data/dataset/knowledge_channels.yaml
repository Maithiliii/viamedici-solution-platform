  - number: SOL-019
    title: Nightly full export takes hours - switch to delta export and batch tuning
    issue: |
      The nightly export to a channel takes many hours (often still running in the morning) and blocks other jobs.
    environment_conditions: All versions; large assortments (>200k products) with full export scheduled every night.
    cause: Full export of the complete assortment every night; runtime grows linearly with assortment and media count.
    resolution_steps: |
      1. Check the job history for runtime trend and exported item count.
      2. Switch the nightly schedule to delta export; keep a weekly full export on the weekend.
      3. Set the batch size to 500 (Export > Profile > Advanced) and, on 9.2+, enable 4 parallel workers.
      4. Ensure the database statistics job runs (index on change log table).
    verification_steps: Nightly runtime below 1 hour; weekly full export finishes on the weekend.
    root_cause: PERF_FULL_EXPORT
    modules: [EXPORT, JOBS]
    integrations: []
