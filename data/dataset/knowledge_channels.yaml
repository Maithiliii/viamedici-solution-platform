  - number: SOL-004
    title: Webshop not updated - connector credentials rotated in the shop system
    issue: |
      The PIM export reports success (or warnings) but the webshop does not show the changes. Shop admins
      recently changed integration users, API keys or access tokens.
    environment_conditions: All versions; webshop connectors with stored API credentials (Shopware 6 integrations, Adobe Commerce integration tokens).
    cause: |
      The shop-side integration credentials were rotated or the integration user was deleted. Depending on the
      connector, the export either fails silently (warnings only) or only the cache invalidation call fails,
      so the shop serves cached old data.
    resolution_steps: |
      1. Check the connector log for HTTP 401/403 responses or "cache invalidation failed" warnings.
      2. Ask the shop admin for the current integration access key / token.
      3. Update the credentials in Export > Channels > Connection and run "Test connection".
      4. Re-run the export (delta is enough) and clear the shop cache once.
    verification_steps: Connection test green; changes visible in the shop after the next export.
    root_cause: INT_TOKEN_EXPIRED
    modules: [EXPORT, API]
    integrations: [SHOPWARE6, ADOBE_COMMERCE]
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: kessler
        version: "8.2"
        date: 2025-01-14
        severity: S3
        channel: email
        engineer: priya
        title: Price changes not shown in webshop although export is green
        report: |
          We changed prices for 2.000 products yesterday. The PIM export is green but in Shopware the old
          prices are shown. Our shop agency did some security changes last week, not sure if related.
        goal: Current prices in the shop.
        symptoms: Export successful, shop shows old data.
        errors: "WARN ShopwareConnector: cache invalidation failed (401 Unauthorized)"
        module: EXPORT
        steps:
          - [Checked connector log, "401 on cache invalidation endpoint", confirmed]
          - [Asked agency about changes, "Integration access key rotated", confirmed]
        outcome: resolved
        resolution: Updated Shopware integration access key in connector; cache cleared.
      - customer: brightline
        version: "9.0"
        date: 2025-07-08
        severity: S2
        channel: portal
        engineer: jonas
        title: Shopware shop stopped updating
        report: |
          Since Monday nothing we change in PIM appears in the shop. No error in the export overview,
          only yellow warnings.
        goal: Shop updates working again.
        symptoms: No updates reach the shop; export warnings.
        errors: "WARN Channel Engine: 3.412 items skipped - remote responded 401"
        module: EXPORT
        holdout: true
        steps:
          - [Checked channel connection test, "401 Unauthorized", confirmed]
        outcome: resolved
        resolution: Shopware integration had been deleted and recreated by the shop team; new credentials stored.
      - customer: baltic
        version: "9.1"
        date: 2026-01-27
