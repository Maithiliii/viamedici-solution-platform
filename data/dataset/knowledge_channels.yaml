        goal: Images for new products in all channels.
        symptoms: New products without images in channels.
        errors: "Amazon feed: MAIN image URL not reachable (404)"
        module: MEDIA
        steps:
          - [Checked DAM connection, "Not using DAM, local media", ruled_out]
          - [Checked renditions for new assets, "Preset 'marketplace_1500' missing for channel amazon", confirmed]
        outcome: resolved
        resolution: Preset added to the Amazon channel and regenerated.
      - customer: nordbau
