# Solutions + the historical cases that produced / reused them.
# Domain: export & channel syndication, media, localisation.
# Each case: customer, version (installed at the time), date, outcome of the
# solution on this case. 'other_solutions' records additional attempts
# (e.g. a solution that was tried and FAILED). 'holdout: true' cases are used
# by the evaluation harness as unseen queries.

solutions:

  - number: SOL-001
    title: Delta export misses variants after inherited attribute change
    issue: |
      Variants (colours, sizes) show old values in the webshop although the parent product was changed
      in the PIM. Changes made directly on the variant are exported correctly. A manual full export fixes
      the webshop until the next parent change.
    environment_conditions: |
      EPIM 8.0 - 8.2 with delta export enabled (introduced in 8.1, also back-ported job option in 8.0).
      Affects every webshop connector using delta exports (Shopware 6, Adobe Commerce, SAP Commerce).
    cause: |
      Product bug in the 8.x change detection: a change to an inherited value updates the parent's change
      timestamp only. Variants inheriting the value keep their old timestamp and are skipped by the
      delta export. Fixed in 9.0 (change detection rewritten).
    resolution_steps: |
      1. Confirm the pattern: compare the variant's "last changed" timestamp with the parent's.
      2. Workaround: schedule a weekly full export for the affected channel (Export > Profiles > Schedule)
         in addition to the nightly delta export.
      3. For urgent cases trigger "Export > Run > Full export (selected products)" for the parent and its variants.
      4. Recommend upgrading to 9.0+ where change detection propagates inherited changes.
    verification_steps: |
      Change an inherited attribute on a parent in QA, run the delta export and check that the variants
      appear in the export log. With the workaround, verify after the next full export.
    root_cause: PRODUCT_BUG_CHANGE_DETECTION
    modules: [EXPORT, PDM]
    integrations: [SHOPWARE6, ADOBE_COMMERCE, SAP_COMMERCE]
    min_version: "8.0"
    max_version: "8.2"
    status: validated
    cases:
      - customer: kessler
        version: "8.0"
        date: 2024-04-16
        severity: S2
        channel: email
        engineer: jonas
        title: Shopware shows old colour names for variants
        report: |
          Hello support, we renamed the colour values of our cable reel series in the PIM last week
          (e.g. "anthrazit" -> "anthracite grey"). The parent product is correct in the shop but all
          variants still show the old names. When our colleague started a full export by hand it was
          fixed, but today we changed the series description and again the variants are old. Please help.
        goal: Variant data in the webshop must match the PIM after the nightly export.
        symptoms: Variants keep old values in Shopware; parent correct; full export fixes it temporarily.
        errors: ""
        module: EXPORT
        steps:
          - [Checked Shopware connector log for errors, "No errors, delta export ran successfully at 02:00", ruled_out]
          - [Compared change timestamps of parent and variants, "Parent changed 2024-04-15, variants still 2024-03-02", confirmed]
          - [Checked whether the changed attribute is inherited, "Colour name is inherited from parent", confirmed]
        outcome: resolved
        resolution: Known change detection limitation in 8.x. Configured weekly full export as workaround; customer informed about fix in 9.0.
      - customer: nordbau
        version: "8.1"
        date: 2024-09-03
        severity: S3
        channel: portal
        engineer: priya
        title: Product variants not updated in Adobe Commerce
        report: |
          Since we use the new delta export, price group and delivery time changes we make on the master
          product do not reach the variants in Magento. Only if somebody touches the variant itself it
          gets exported. Is the delta export broken?
        goal: Use delta export without losing variant updates.
        symptoms: Delta export skips variants when master product data changes.
        errors: ""
        module: EXPORT
        steps:
          - [Checked export profile filter, "Filter includes all released products", ruled_out]
          - [Ran delta export with debug log for one master product, "Variants not part of the changed-items set", confirmed]
        outcome: resolved
        resolution: Same change detection issue as known for 8.x. Added weekly full export; explained that 9.0 fixes it.
      - customer: brightline
        version: "8.1"
        date: 2024-11-19
        severity: S3
        channel: email
        engineer: marco
        title: Lamp variants show outdated wattage in shop
        report: |
          We updated the wattage on 40 lamp families (on family level) for the new EU labels. In Shopware
          the family pages are fine but each colour variant still shows the old wattage. The delta job
          says success. We need this fixed before the label deadline.
        goal: Correct energy data on every variant before the regulatory deadline.
        symptoms: Delta export successful but variants not updated after family-level change.
        errors: ""
        module: EXPORT
        holdout: true
        steps:
          - [Checked whether Shopware cache is stale, "Cache cleared, values still old", ruled_out]
          - [Checked variant change timestamps, "Variants not touched since September", confirmed]
        outcome: resolved
