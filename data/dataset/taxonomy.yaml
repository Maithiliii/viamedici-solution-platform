# Synthetic reference data for the Solution Enablement Platform.
# All customers, people and product versions are fictional. The product
# structure mirrors a typical enterprise PIM/MDM platform (EPIM-like).

users:
  - key: lena
    first_name: Lena
    last_name: Hoffmann
    email: lena.hoffmann@sep.example.com
    role: Solution Architect
  - key: jonas
    first_name: Jonas
