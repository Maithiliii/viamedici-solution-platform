# Domain: import & onboarding, classification, product data model.

solutions:

  - number: SOL-005
    title: SAP import rejects rows with "Unknown unit" (unit of measure mapping)
    issue: |
      ERP import from SAP finishes with errors; a subset of materials is rejected with an unknown unit
      message. Typically after new materials or new units were introduced in SAP.
    environment_conditions: All versions; SAP ECC / S/4HANA import via IDoc or file. Affects quantity attributes (packaging unit, order unit).
    cause: |
      SAP sends internal (language-dependent) unit codes such as "ST" or "KAR". EPIM expects ISO / UN/ECE
      codes (PCE, CT). Units without an entry in the unit mapping table are rejected.
    resolution_steps: |
      1. Open the import log and collect the distinct unknown unit codes (filter on ERR-IMP-2207).
      2. Add mappings in Import > Mappings > Units (e.g. ST -> PCE, KAR -> CT, PAK -> PK).
      3. Re-run the import for rejected rows only ("Retry rejected").
      4. Ask the SAP team to send ISO codes (T006-ISOCODE) for new units in the future.
    verification_steps: Retry finishes without ERR-IMP-2207; packaging units visible on products.
    root_cause: DATA_UOM_MAPPING
    modules: [IMPORT]
    integrations: [SAP_S4, SAP_ECC]
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: kessler
        version: "8.0"
        date: 2024-03-12
        severity: S3
        channel: email
        engineer: marco
        title: SAP import partially fails for new cable drums
        report: |
          The nightly SAP import rejected 214 materials. All are new cable drums. Error says unknown unit.
          We need them in the shop next week.
        goal: All new materials imported.
        symptoms: Partial import failure for new materials.
        errors: "ERR-IMP-2207 Unknown unit 'TRM' for attribute order_unit"
        module: IMPORT
        steps:
          - [Checked import log, "All rejections ERR-IMP-2207 with unit TRM", confirmed]
          - [Checked unit mapping table, "TRM (drum) not mapped", confirmed]
        outcome: resolved
        resolution: Added mapping TRM -> DRM (ISO drum); retried rejected rows.
      - customer: nordbau
        version: "8.1"
        date: 2024-10-08
        severity: S3
        channel: portal
        engineer: sophie
        title: Import errors after new pallet units in SAP
        report: |
          After our logistics department introduced new pallet units in SAP, around 900 articles fail in the
          import with ERR-IMP-2207.
        goal: Import working again.
        symptoms: Import errors for articles with new pallet units.
        errors: "ERR-IMP-2207 Unknown unit 'PAL'"
        module: IMPORT
        steps:
          - [Checked unit mapping, "PAL not mapped", confirmed]
        outcome: resolved
        resolution: Mapped PAL -> PF; retried rejected rows.
      - customer: brightline
        version: "9.0"
        date: 2025-05-13
        severity: S3
        channel: email
        engineer: jonas
        title: S/4 import rejects LED strips
        report: |
          LED strips sold per meter are rejected by the import since we created them in S/4. Error about the unit.
        goal: LED strips in PIM.
        symptoms: Rejected rows for meter-based products.
        errors: "ERR-IMP-2207 Unknown unit 'M' for attribute sales_unit"
        module: IMPORT
        holdout: true
        steps:
          - [Checked mapping table, "Internal code M not mapped (ISO MTR)", confirmed]
        outcome: resolved
        resolution: Added M -> MTR mapping and asked SAP team to send ISO codes.
      - customer: polar
        version: "9.2"
        date: 2026-07-14
        severity: S4
        channel: portal
        engineer: priya
        title: Import warning unknown unit for spare part sets
        report: |
          Spare part sets are not imported: unknown unit SET.
        goal: Import spare part sets.
        symptoms: Unknown unit error.
        errors: "ERR-IMP-2207 Unknown unit 'SET'"
        module: IMPORT
        steps:
          - [Checked mapping, "SET missing", confirmed]
        outcome: resolved
        resolution: Mapping SET -> SET (ISO) added.

  - number: SOL-006
    title: Umlauts and special characters garbled after supplier CSV import (encoding)
    issue: |
      Texts imported from supplier or spreadsheet files show broken characters such as "Ã¼" instead of "ü",
      "Ã©" instead of "é" or "?" in product names.
    environment_conditions: All versions; CSV/TXT imports created by spreadsheet tools on Windows.
    cause: The file is encoded in Windows-1252 (ANSI) while the import profile expects UTF-8 (or vice versa).
    resolution_steps: |
      1. Check the file encoding (e.g. open in a text editor showing encoding, or `file -i`).
      2. Set the encoding in Import > Profile > File settings to the real encoding (Windows-1252) or enable "Detect BOM".
      3. Re-import the file; fix already imported texts by re-importing with "overwrite texts".
      4. Ask the supplier to deliver UTF-8.
    verification_steps: Special characters correct in a sample of products.
    root_cause: CFG_IMPORT_ENCODING
    modules: [IMPORT]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: hanse
        version: "8.0"
        date: 2024-05-07
        severity: S3
        channel: email
        engineer: priya
        title: Supplier data with broken umlauts
        report: |
          The new supplier list for bathroom accessories was imported but all German umlauts are broken
          ("WaschbeckenablaufgarnitÃ¼r"). Can you fix this?
        goal: Correct product texts.
        symptoms: Garbled umlauts after CSV import.
        errors: ""
        module: IMPORT
        steps:
          - [Checked file encoding, "Windows-1252, profile set to UTF-8", confirmed]
        outcome: resolved
        resolution: Encoding set to Windows-1252, re-imported with overwrite.
      - customer: technoparts
        version: "8.1"
        date: 2024-11-26
        severity: S4
        channel: portal
        engineer: marco
        title: Special characters wrong in product names
        report: |
          Product names with "µ" and "°" are shown as "?" after the Excel import.
        goal: Correct units in product names.
        symptoms: Question marks instead of special characters.
        errors: ""
        module: IMPORT
        steps:
          - [Checked file, "Saved as CSV (ANSI)", confirmed]
        outcome: resolved
        resolution: Customer saves as "CSV UTF-8"; reimported.
      - customer: baltic
        version: "9.1"
        date: 2026-02-10
        severity: S3
        channel: email
        engineer: sophie
        title: Latvian characters broken after import
        report: |
          Latvian product names (ā, ē, š) are broken after importing the supplier file.
        goal: Correct Latvian names.
        symptoms: Broken diacritics.
        errors: ""
