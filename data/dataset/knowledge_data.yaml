  - number: SOL-010
    title: Variant shows outdated value - local override set by bulk edit
    issue: |
      One or more variants show an old/different value although the parent was updated; other variants of the
      same product are correct. The effect is visible in the PIM itself, not only in channels.
    environment_conditions: All versions (8.0+ inheritance model).
    cause: A bulk edit or import wrote values directly on the variants, which sets a local override ("value locked") and stops inheritance for that attribute.
    resolution_steps: |
      1. Open the variant, attribute shows a lock icon / "overridden" badge.
      2. Use Bulk edit > "Revert to inherited value" for the attribute on affected variants.
      3. Check the import profile / bulk edit that wrote the values to avoid recurrence.
    verification_steps: Variants show the inherited badge and the parent's value.
    root_cause: USER_LOCAL_OVERRIDE
    modules: [PDM]
    integrations: []
    min_version: "8.0"
    max_version: null
    status: validated
    cases:
      - customer: vinea
        version: "8.2"
        date: 2024-12-03
        severity: S4
        channel: portal
        engineer: priya
        title: Some sofa variants keep old material text
        report: |
          We changed the material description on the sofa family. Three of the colour variants still show the
          old text even in the PIM.
        goal: Consistent texts.
        symptoms: Some variants with old value in PIM.
        errors: ""
        module: PDM
        steps:
          - [Checked export, "Problem visible in PIM already", ruled_out]
          - [Opened variant, "Attribute overridden locally", confirmed]
        outcome: resolved
        resolution: Reverted to inherited value via bulk edit.
      - customer: lumen
        version: "9.2"
        date: 2026-06-23
        severity: S4
        channel: email
        engineer: sophie
        title: Old prices on a few pen variants
        report: |
          A few pen colours show the old recommended retail price in PIM while the family has the new one.
        goal: Correct prices.
        symptoms: Some variants differ from parent.
        errors: ""
        module: PDM
        steps:
          - [Checked variants, "Locked by price import last year", confirmed]
        outcome: resolved
        resolution: Reverted override, adjusted import profile.
      - customer: kessler
        version: "8.2"
        date: 2024-12-17
        severity: S3
        channel: portal
        engineer: marco
        title: Variants differ from master in PIM after import
        report: |
          Some variants show different technical data than the master in PIM itself. This happened after an import from a supplier.
        goal: Variants inherit master data again.
        symptoms: Variants not inheriting.
        errors: ""
        module: PDM
        holdout: true
        steps:
          - [Checked change detection (known 8.x issue), "Not relevant, data wrong in PIM", ruled_out]
          - [Checked override flags, "Supplier import wrote values on variants", confirmed]
        outcome: resolved
        resolution: Reverted overrides; import profile limited to master level.

  - number: SOL-026
    title: Prices or dimensions imported 1000x too high (decimal separator / locale)
    issue: |
      Numeric values from an ERP import are wrong by factor 1000 (e.g. 1.299 imported as 1299) or decimals are lost.
    environment_conditions: All versions; ERP file imports with locale-specific number format (decimal comma).
    cause: "The import job parses numbers with the wrong locale (1.299,00 in de-DE format parsed as en-US or vice versa)."
    resolution_steps: |
      1. Compare source file values with imported values to confirm the factor.
      2. Set Import > Profile > Number format locale to the file's locale (e.g. de-DE / lv-LV).
      3. Re-import affected values; check price exports were not already published.
    verification_steps: Sample values identical to source.
    root_cause: CFG_IMPORT_LOCALE
    modules: [IMPORT]
    integrations: [D365]
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: alpenrad
        version: "8.2"
        date: 2025-04-08
        severity: S1
        channel: phone
        engineer: jonas
        title: Bike prices 1000 times too high
        report: |
          Our bikes cost 1.299.000 EUR in the shop since this morning! Dynamics import ran at night.
        goal: Correct prices immediately.
        symptoms: Prices multiplied by 1000.
        errors: ""
        module: IMPORT
        steps:
          - [Checked source file, "1.299,00 in file", confirmed]
          - [Checked import locale, "en-US", confirmed]
        outcome: resolved
        resolution: Locale set to de-DE, re-imported, export re-run.
      - customer: baltic
        version: "9.1"
        date: 2026-04-28
        severity: S2
        channel: email
        engineer: priya
        title: Screw lengths wrong after Dynamics import
        report: |
          After the new Dynamics export format our screw lengths are wrong (4,5 mm became 45 mm).
        goal: Correct dimensions.
        symptoms: Decimal lost.
        errors: ""
        module: IMPORT
        steps:
          - [Checked number format, "File uses decimal comma, profile en", confirmed]
        outcome: resolved
        resolution: Locale lv-LV for profile; reimport.
