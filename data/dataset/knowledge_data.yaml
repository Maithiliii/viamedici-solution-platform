  - number: SOL-007
    title: Duplicate products after supplier import (leading zeros lost in article keys)
    issue: |
      After a supplier/spreadsheet import, products exist twice (e.g. article 004711 and 4711), one with the
      old data and one with the new data.
    environment_conditions: All versions; imports matching products by an article number that can contain leading zeros.
    cause: The spreadsheet tool converted article numbers to numbers and removed leading zeros, so the import did not match existing products and created new ones.
    resolution_steps: |
      1. Identify duplicates with Search > "Duplicate check" on the key attribute (normalised).
      2. Add a key normalisation rule in the import profile (pad to 6 digits / treat as text).
      3. Merge duplicates with Tools > "Merge products" (keep the original ID, take new values).
      4. Ask the supplier to format the key column as text.
    verification_steps: Re-import of the same file creates no new products.
    root_cause: DATA_KEY_NORMALIZATION
    modules: [IMPORT, PDM]
    integrations: []
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: rheinwerk
        version: "8.0"
        date: 2024-06-18
        severity: S2
        channel: phone
        engineer: jonas
        title: 2.000 duplicate products after supplier import
        report: |
          After importing the price list from our saw blade supplier we have every product twice. The new ones have no images.
        goal: No duplicates; prices on original products.
        symptoms: Duplicates created by import.
        errors: ""
        module: IMPORT
        steps:
          - [Compared keys of duplicates, "Leading zeros missing on new products", confirmed]
        outcome: resolved
        resolution: Normalisation rule added, duplicates merged.
      - customer: baltic
        version: "8.1"
        date: 2024-09-24
        severity: S3
        channel: email
        engineer: priya
        title: Import created new articles instead of updating
        report: |
          The import from the supplier Excel created about 300 new articles. They should update existing ones.
        goal: Updates on existing articles.
        symptoms: New articles instead of updates.
        errors: ""
        module: IMPORT
        steps:
          - [Checked matching key, "Key 00012345 vs 12345", confirmed]
        outcome: resolved
        resolution: Key padded to 8 digits in profile; merged duplicates.

  - number: SOL-008
    title: ETIM features missing after classification upgrade (ETIM 9 -> ETIM 10)
    issue: |
      After switching to a new ETIM version, products lose feature values, some classes show "unmapped
      features", and exports (BMEcat, webshop filters) are incomplete.
    environment_conditions: EPIM 9.0+ (ETIM 10 support) when upgrading classification from ETIM 9; similar for any ETIM major version change.
    cause: Feature codes changed or were split/merged between ETIM versions. Without running the remap job using the ETIM change log, values of changed features are not transferred.
    resolution_steps: |
      1. Import the official ETIM change log (Classification > ETIM > Change log import).
      2. Run "Classification remap job" in simulation mode and review unmapped features.
      3. Map remaining features manually, run the job in execute mode.
      4. Re-run BMEcat/webshop exports.
    verification_steps: Simulation report shows 0 unmapped features for active classes.
    root_cause: UPGRADE_CLASSIFICATION_VERSION
    modules: [CLASS]
    integrations: [BMECAT]
    min_version: "9.0"
    max_version: null
    status: validated
    cases:
      - customer: kessler
        version: "9.0"
        date: 2025-06-17
        severity: S2
        channel: email
        engineer: sophie
        title: Feature values lost after switch to ETIM 10
        report: |
          We switched to ETIM 10 last week. Now many cables have empty features (conductor cross-section etc.)
          and our wholesalers complain about incomplete BMEcat files.
        goal: Complete ETIM 10 data.
        symptoms: Empty features after ETIM upgrade.
        errors: "BMEcat validation: 18.442 mandatory features empty"
        module: CLASS
        steps:
          - [Checked if remap job ran, "Only class assignment switched, no remap", confirmed]
        outcome: resolved
        resolution: Imported change log and ran remap job; 312 features mapped manually.
      - customer: hanse
        version: "9.1"
        date: 2026-02-24
        severity: S2
        channel: portal
        engineer: marco
        title: ETIM 10 classes show unmapped features
        report: |
          After the upgrade we moved to ETIM 10. Many classes show "unmapped features" and values are missing.
        goal: Clean ETIM 10 classification.
        symptoms: Unmapped features.
        errors: ""
        module: CLASS
        holdout: true
        steps:
          - [Ran remap simulation, "1.204 unmapped features", confirmed]
        outcome: resolved
        resolution: Change log imported, remap executed.
      - customer: brightline
        version: "9.0"
        date: 2025-10-07
        severity: S3
        channel: email
        engineer: jonas
        title: Luminaire features empty after ETIM change
        report: |
          Lamp features like "colour rendering index" are empty after changing to ETIM 10.
        goal: Complete lamp features.
        symptoms: Feature values missing.
        errors: ""
        module: CLASS
        steps:
          - [Checked remap job history, "Never executed", confirmed]
        outcome: resolved
        resolution: Remap job executed with change log.

  - number: SOL-009
    title: BMEcat validation fails with invalid FEATURE_SYSTEM_NAME (wrong ECLASS version in profile)
    issue: |
      BMEcat files are rejected by the customer's/partner's validator with errors on FEATURE_SYSTEM_NAME or
      unknown feature IDs.
    environment_conditions: All versions with BMEcat export using ECLASS.
    cause: The export profile declares an older ECLASS version (e.g. ECLASS-11.0) while products are classified with a newer version (13.0/14.0).
    resolution_steps: |
      1. Open the BMEcat export profile and check "Feature system" and version.
      2. Set it to the version used for classification (e.g. ECLASS-13.0) or export both versions.
      3. Re-generate the catalog and validate with the BMEcat validator.
    verification_steps: Validator passes.
    root_cause: CFG_EXPORT_STANDARD_VERSION
    modules: [EXPORT, CLASS]
    integrations: [BMECAT]
    min_version: null
    max_version: null
    status: validated
    cases:
      - customer: technoparts
        version: "8.1"
        date: 2024-07-30
        severity: S3
        channel: email
        engineer: jonas
        title: Distributor rejects BMEcat
        report: |
          Our distributor rejects the BMEcat catalogue: "ERR-BME-0412 Invalid FEATURE_SYSTEM_NAME". Nothing changed.
        goal: Catalogue accepted.
        symptoms: BMEcat rejected.
        errors: "ERR-BME-0412 Invalid FEATURE_SYSTEM_NAME ECLASS-11.0 for feature 0173-1#02-AAO677#002"
        module: EXPORT
        steps:
          - [Checked profile, "ECLASS-11.0 declared, data ECLASS 13", confirmed]
        outcome: resolved
        resolution: Profile updated to ECLASS-13.0.
      - customer: technoparts
        version: "9.1"
        date: 2026-04-14
        severity: S3
        channel: portal
        engineer: priya
        title: BMEcat errors after ECLASS 14 reclassification
